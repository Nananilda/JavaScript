<!-- O site é uma simulação do VSCO, mas sem edição de fotos e nenhuma funcionalidade legal, é para simular
(ou algo do tipo), o envio de fotos para um aplicativo de postagens, e ele naturalmente pega os dados pessoais (?).
A funcionalidade da mensagem é um retorno visual-->

<body>
    <h1><b>Registro de fotos</b></h1>
    <div id="fundo">
        <h3>Localização</h3>
        <div id="quadro1">
            <div id="quadrinho">
                <p><b>Latitude: </b></p>
                <p id="latitude"></p>
            </div>

            <div id="quadrinho">
                <p><b>Longitude: </b></p>
                <p id="longitude"></p>
            </div>

            <div id="quadrinho">
                <p><b>Precisão: </b></p>
                <p id="precisao"></p>
            </div>
        </div>

        <h3>Câmera</h3>
        <div id="quadro2">
            <video id="camera" autoplay></video>
        </div>

        <button id="botao"><b>Enviar registro</b></button>
    </div>

    <script src="script.js"></script>
</body>

</html>
