<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aplicação DragAndDrop</title>
</head>

<body>

    <div id="grupoPrincipal">
        <div class="cadastro">
            <h2>Cadastro de pessoas</h2>
            <input id="nomePessoa" type="text" placeholder="nome da pessoa"> <br><br>
            <button id="botaoPessoa">Cadastrar</button>
        </div>

        <div class="cadastro">
            <h2>Cadastro de grupos</h2>
            <input id="nomeGrupo" type="text" placeholder="nome do grupo"><br><br>
            <button id="botaoGrupo">Cadastrar</button>
        </div>
    </div>

    <div id="grupoSecundario">
        <div class="resultado">
            <h3>Pessoas cadastradas</h3>
            <div id="resultadoPessoa"></div>
        </div>

        <div class="resultado">
            <h3>Grupos cadastrados</h3>
            <div id="resultadoGrupo"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
